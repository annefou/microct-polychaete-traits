name: Check repository readiness
description: >-
  Single source of truth for "should this workflow actually run its pipeline?".
  Returns ready=true once the template has been initialised (the
  .template-uninitialised sentinel is gone) and the notebooks are no longer
  scaffolds; otherwise ready=false with an explanatory ::notice::. Fails loudly
  rather than skipping green in two cases — the silent-green failure mode:
    1. The run is a release event on a NON-template repo. A release of an unready
       replication is always a bug, and its archival (Zenodo / Software Heritage /
       Wayback) is permanent. The canonical template itself (is_template=true) is
       exempt: it may cut version-marker releases and simply skips archival.
    2. The repo looks like a finished replication (real published nanopub URIs
       in nanopubs/PUBLISHED.md) yet would still skip.
  Case 1 is independent of case 2 on purpose: Phase 4 (release) precedes Phase 5
  (publish the chain), so PUBLISHED.md is legitimately empty at a first release.

outputs:
  ready:
    description: "'true' when the pipeline should run, 'false' to skip."
    value: ${{ steps.check.outputs.ready }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        # GitHub sets is_template=true only on the canonical template repository;
        # a repo created *from* it via "Use this template" has is_template=false.
        # Tripwire 1 uses this to tell "the template cutting a version-marker
        # release" (fine — skip archival) from "an un-initialised replication
        # being released" (a bug — fail).
        IS_TEMPLATE: ${{ github.event.repository.is_template }}
      run: |
        ready=true
        reason=""

        # 1. Not-initialised: the sentinel is the ONLY signal. No repo-wide
        #    {{...}} grep — the template legitimately ships literal token
        #    examples in docs/ and .claude/, which is what used to cause
        #    false-positive skips (and silent-green CI) downstream.
        if [ -f .template-uninitialised ]; then
          ready=false
          reason="Template not initialised — run /init-template (the .template-uninitialised sentinel is still present)."

        # 2. Scaffold notebooks: initialised, but Phase-2 code not written yet.
        #    Scoped to notebooks/*.py only, so it can never trip on prose.
        elif ls notebooks/*.py >/dev/null 2>&1 \
             && grep -lE 'raise NotImplementedError|"<dataset-name>"|# Example skeleton — adapt' notebooks/*.py >/dev/null 2>&1; then
          ready=false
          reason="Notebooks are still scaffolds — implement notebooks/*.py (Phase 2) before the pipeline can run."
        fi

        if [ "$ready" = "false" ]; then
          echo "::notice::${reason} Skipping the pipeline steps for this run."

          # Tripwire 1 — release events. Cutting a release of an unready repo is
          # always a bug: the release, its Zenodo deposit, and the Software
          # Heritage / Wayback archival all happen regardless of what this guard
          # decides, and they are permanent. This must fire independently of
          # PUBLISHED.md, because CLAUDE.md orders Phase 4 (release) BEFORE
          # Phase 5 (publish the chain) — so at a first release PUBLISHED.md is
          # still empty by design and Tripwire 2 below is dormant at exactly the
          # moment it is most needed.
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "${IS_TEMPLATE}" != "true" ]; then
            echo "::error::${reason} BUT this is a release event — a release of an unready repository is always a bug. The release and its permanent archival (Zenodo, Software Heritage, Wayback) cannot be undone. Failing instead of skipping green; fix the sentinel/scaffold state above, then re-cut the release."
            exit 1
          elif [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            # is_template=true: the canonical template repo itself. It is allowed
            # to cut a version-marker GitHub Release WITHOUT archiving itself —
            # Zenodo / Software Heritage / Wayback archival is for a scaffolded
            # replication, never the template. Skip the pipeline green here.
            echo "::notice::Release on the template repository itself (is_template=true) — skipping the archival pipeline (the template is never archived; replications are). Expected, not a failure."
          fi

          # Tripwire 2 — a finished replication that still wants to skip is a bug,
          # not an expected scaffold state. "Finished" = real published nanopub
          # URIs recorded in nanopubs/PUBLISHED.md (np/RA + >=10 id chars, so the
          # template's own "np/RA…" example placeholders do NOT match). This is
          # the check that turns the old silent-green skip into a loud failure.
          if grep -qE 'w3id\.org/(sciencelive/)?np/RA[A-Za-z0-9_-]{10,}' nanopubs/PUBLISHED.md 2>/dev/null; then
            echo "::error::${reason} BUT nanopubs/PUBLISHED.md already records published nanopub URIs — this repo is a finished replication and must not be skipping its pipeline. This is the silent-green failure mode the template guards against. Failing instead of passing green; fix the sentinel/scaffold state above."
            exit 1
          fi
        fi

        echo "ready=$ready" >> "$GITHUB_OUTPUT"
